    <title>Dropdown clipping regression</title>

  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import {
        DropdownMenu,
        DropdownMenuContent,
        DropdownMenuItem,
        DropdownMenuTrigger,
      } from '/src/components/ui/dropdown-menu.tsx'
      import '/src/index.css'

      const SIZES = ['10', '25', '50', '100']

      function Menu() {
        return React.createElement(
          DropdownMenu,
          null,
          React.createElement(
            DropdownMenuTrigger,
            { render: React.createElement('button', { className: 'button' }, 'Actions') },
          ),
          React.createElement(
            DropdownMenuContent,
            { align: 'right', sideOffset: 4, className: 'popover max-h-24' },
            SIZES.map((size) => React.createElement(
              DropdownMenuItem,
              { key: size },
              size,
            )),
          ),
        )
      }

        React.createElement('div', {
          style: {
            position: 'absolute', bottom: 80, right: 16,
            width: 260, height: 60, overflow: 'hidden', border: '1px solid gray',
          },
        }, React.createElement(Menu)),
      )
    </script>
