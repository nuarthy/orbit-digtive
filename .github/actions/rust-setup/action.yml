name: Rust setup
description: Installs the pinned Rust toolchain, sccache and the shared dependency cache for one CI job.

inputs:
  shared-key:
    description: Cache namespace shared by jobs that compile the same targets
    required: true
  components:
    description: Comma-separated rustup components
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust ${{ inputs.components }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
        components: ${{ inputs.components }}
    - name: Cache compiled units
      uses: mozilla-actions/sccache-action@v0.0.11
    - name: Cache Cargo registry and target
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.shared-key }}
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
